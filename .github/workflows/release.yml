name: Build & Publish Debian (.deb) Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.0) when triggered manually'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release-deb:
    name: Build Standalone Debian .deb Installer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Debian packaging & media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg dpkg fakeroot rpm

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full automated test suite before packaging
        run: |
          npm run lint
          npm run build
          npm test

      - name: Package standalone Electron Debian (.deb) installer
        run: |
          npm install --no-save electron@^35.0.0 electron-builder@^26.0.12
          npx electron-builder --linux deb --x64 --publish never

      - name: Prepare .deb release asset and SHA256 checksums
        run: |
          mkdir -p release-assets
          cp dist-electron/*.deb release-assets/
          cd release-assets
          sha256sum *.deb > SHA256SUMS.txt
          ls -lh

      - name: Upload .deb artifact to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: screenrec-debian-amd64-deb
          path: |
            release-assets/*.deb
            release-assets/SHA256SUMS.txt

      - name: Publish .deb installation file to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.deb
            release-assets/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ### Debian / Ubuntu Installation (.deb)
            Download the `.deb` package below and install with `apt` (automatically resolves `ffmpeg` and portal dependencies):
            ```bash
            sudo apt install ./screenrec_*_amd64.deb
            ```
            **Features included:**
            - Automatic **X11** and **Wayland** (`xdg-desktop-portal` + PipeWire) detection on startup
            - Record **Entire Screen**, **Application Window**, or **Browser Tab**
            - **System Audio** capture + optional **Microphone** voiceover mixing
            - **Mouse Cursor** include/exclude toggle
            - Direct **MP4** (`H.264` + `AAC`) export
