name: Build & Publish Native GTK3 Debian (.deb) Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v2.0.0) when triggered manually'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release-deb:
    name: Compile Native GTK3 App & Publish Debian .deb Installer
    # Build on ubuntu-22.04 (glibc 2.35 / GLIBC_2.34 symbols) so the single compiled ELF binary runs
    # across Debian 12 Bookworm, Debian 13 Trixie, Ubuntu 22.04/24.04+, Linux Mint 21/22, LMDE 6,
    # MX Linux 23, Pop!_OS, KDE neon, Zorin OS, Elementary OS, and Kali.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release version & tag
        id: meta
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ github.event.inputs.release_tag }}" ]]; then
            TAG_NAME="${{ github.event.inputs.release_tag }}"
          else
            TAG_NAME="v${PKG_VER}"
          fi
          echo "version=${PKG_VER}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Install native GTK3 C11 compiler & Debian packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libx11-dev \
            xvfb x11-utils pulseaudio-utils ffmpeg dpkg file

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Compile & test native C11 + GTK3 binary (unit tests + headless Xvfb GUI & MP4 test)
        run: make -C native clean && make -C native test

      - name: Build native Debian (.deb) package & run full integration test suite
        run: |
          npm run lint
          npm run build
          npm run build:deb
          npm test

      - name: Verify ELF binary & prepare release assets
        run: |
          mkdir -p release-assets
          cp "dist-deb/screenrec_${{ steps.meta.outputs.version }}_amd64.deb" release-assets/
          cd release-assets
          sha256sum *.deb > SHA256SUMS.txt
          dpkg-deb --info *.deb
          dpkg-deb --contents *.deb
          ls -lh

      - name: Upload .deb artifact to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: screenrec-debian-amd64-deb
          path: |
            release-assets/*.deb
            release-assets/SHA256SUMS.txt

      - name: Publish .deb installation file to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ScreenRec ${{ steps.meta.outputs.tag_name }} (Native GTK3 Debian / Ubuntu .deb)
          files: |
            release-assets/*.deb
            release-assets/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ### Native GTK3 Desktop Release for Debian-Based Linux Distributions
            Compatible with **Debian 12/13**, **Ubuntu 22.04/24.04+**, **Linux Mint 21/22 & LMDE 6**, **MX Linux 23**, **Pop!_OS**, **KDE neon**, **Zorin OS**, **Elementary OS**, and **Kali**.

            #### 1-Click GUI Installation (No Command Line Needed)
            1. Download **`screenrec_${{ steps.meta.outputs.version }}_amd64.deb`** below.
            2. Double-click the `.deb` file in your file manager to open **GNOME Software / KDE Discover / GDebi / MintInstall / MX Package Installer** and click **Install**.
            3. Click **Open / Launch** right inside the installer or launch **ScreenRec** from your desktop **Application Menu**.

            **Highlights:**
            - Natively compiled **C11 + GTK3 ELF binary** (`/usr/bin/screenrec`) — no Electron or localhost browser wrapper
            - Automatic **Wayland** (`xdg-desktop-portal` + PipeWire) and **X11** (`x11grab`) detection on GUI startup
            - Record **Entire Screen**, **Application Window**, or **Browser Tab / Window**
            - **System Audio** capture + optional **Microphone** voiceover mixing
            - **Mouse Cursor** include/exclude toggle & global power-user shortcuts (`F9` / `F10`)
            - Direct **MP4** (`H.264` + `AAC`) export via native GTK Save dialog
